# Builds ThaanDB for Windows and macOS when a version tag is pushed, and attaches the
# zips to a GitHub release for that tag. Nothing else starts it automatically.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Cache: GitHub keeps a cache per ref, and a tag run can restore main's cache but not
# an earlier tag's. So tag runs only restore, and main's cache is the one they use. It is
# saved by "Run workflow" on main (Actions tab, manual only), worth doing after the
# dependencies change. Builds are not code-signed (see docs/releasing.md).
name: Release

on:
  push:
    tags: ["v*"]
  # Manual only: refreshes main's Cargo cache, or builds zips without a release.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The keychain crate can link D-Bus on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo test --workspace --exclude thaan-app

  windows:
    name: Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Dependencies (GPUI is most of the build time) come from the cache main saved.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # On Windows, GPUI compiles its shaders with fxc.exe from the Windows SDK, which
      # the runner has. build.rs links the app icon and version info (app.res).
      - run: cargo build --release -p thaan-app -p thaan-cli
      - name: Package
        shell: pwsh
        run: |
          $name = "ThaanDB-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/thaan-app.exe "dist/$name/ThaanDB.exe"
          Copy-Item target/release/thaan.exe "dist/$name/thaan.exe"
          @"
          ThaanDB ${{ github.ref_name }} for Windows (x64)

          Run ThaanDB.exe. thaan.exe is the command-line client.
          Needs Windows 10 (1903 or later) or 11, 64-bit, and the Microsoft Visual C++
          Redistributable 2015-2022 (x64): https://aka.ms/vs/17/release/vc_redist.x64.exe
          The exe is not code-signed: if SmartScreen warns, choose More info, then Run anyway.
          "@ | Set-Content "dist/$name/README.txt"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-universal
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # One app for Apple Silicon and Intel (lipo), with the app icon and the CLI inside.
      - run: scripts/bundle-macos.sh --universal
      - name: Package
        run: |
          name="ThaanDB-${{ github.ref_name }}-macos-universal"
          mkdir -p dist
          # ditto keeps the bundle's permissions and symlinks, which plain zip can lose.
          ditto -c -k --keepParent target/ThaanDB.app "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags, to list the commits since the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt
      - name: Release notes
        run: |
          scripts/release-notes.sh "${{ github.ref_name }}" \
            "${{ github.server_url }}/${{ github.repository }}" > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          # The commits since the previous tag, grouped by type (scripts/release-notes.sh).
          body_path: notes.md
          # A tag with a dash (v0.2.0-beta.1) is published as a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
