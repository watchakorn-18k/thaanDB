[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/thaan-core", "crates/thaan-driver-sqlite", "crates/thaan-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = ""

[workspace.dependencies]
thaan-core = { path = "crates/thaan-core" }
thaan-driver-sqlite = { path = "crates/thaan-driver-sqlite" }
thaan-driver-postgres = { path = "crates/thaan-driver-postgres" }
thaan-driver-mysql = { path = "crates/thaan-driver-mysql" }
thaan-driver-mongodb = { path = "crates/thaan-driver-mongodb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
