[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/dbm-core", "crates/dbm-driver-sqlite", "crates/dbm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = ""

[workspace.dependencies]
dbm-core = { path = "crates/dbm-core" }
dbm-driver-sqlite = { path = "crates/dbm-driver-sqlite" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
