[package]
name = "thaan-web"
description = "ThaanDB in the browser (WebAssembly): a demo of the desktop app for GitHub Pages."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is wasm-only: on other targets this crate is empty, so workspace builds,
# tests and clippy on the desktop are unaffected.
[target.'cfg(target_family = "wasm")'.dependencies]
thaan-core.workspace = true
# Without `bundled`: SQLite itself comes from sqlite-wasm-rs (see scripts/build-web.sh).
thaan-driver-sqlite = { path = "../thaan-driver-sqlite", default-features = false }
# Only its `packet` module (MQTT wire format); the browser carries it over WebSocket.
thaan-driver-mqtt.workspace = true
gpui-kit = { version = "0.11.0" }
wasm-bindgen = "0.2"
js-sys = "0.3"
# SQLite for wasm32-unknown-unknown: provides the sqlite3_* symbols rusqlite links against.
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
serde_json.workspace = true
web-sys = { version = "0.3", features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event", "Window", "Document"] }
