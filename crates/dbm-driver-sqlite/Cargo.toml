[package]
name = "dbm-driver-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["bundled"]
# Compiles SQLite from C (allowed: I/O-edge crate, behind a feature).
bundled = ["rusqlite/bundled"]

[dependencies]
dbm-core.workspace = true
rusqlite = { version = "0.43", features = ["column_decltype"] }
